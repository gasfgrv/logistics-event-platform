services:
  logistics-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: logistics-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  logistics-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: logistics-kafka
    depends_on:
      - logistics-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: logistics-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://logistics-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:29092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  logistics-schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: logistics-schema-registry
    depends_on:
      logistics-kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: logistics-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: logistics-kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  logistics-kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: logistics-kafka-init
    depends_on:
      logistics-kafka:
        condition: service_healthy
      logistics-schema-registry:
        condition: service_healthy
    command: >
      bash -c "
      kafka-topics --bootstrap-server logistics-kafka:29092 --create --if-not-exists --topic order.created --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server logistics-kafka:29092 --create --if-not-exists --topic order.cancelled --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server logistics-kafka:29092 --create --if-not-exists --topic freight.calculated --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server logistics-kafka:29092 --create --if-not-exists --topic freight.failed --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server logistics-kafka:29092 --create --if-not-exists --topic transport.reserved --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server logistics-kafka:29092 --create --if-not-exists --topic transport.failed --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server logistics-kafka:29092 --create --if-not-exists --topic shipment.dispatched --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server logistics-kafka:29092 --create --if-not-exists --topic shipment.delivered --partitions 3 --replication-factor 1
      "

  logistics-kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: logistics-kafdrop
    depends_on:
      logistics-kafka:
        condition: service_healthy
      logistics-schema-registry:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: logistics-kafka:29092
      SCHEMAREGISTRY_CONNECT: http://logistics-schema-registry:8081
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXT_PATH: "/"

  logistics-dynamodb:
    image: localstack/localstack:4.14.0
    container_name: logistics-dynamodb
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      DEFAULT_REGION: us-east-1
    volumes:
      - "./localstack_data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
